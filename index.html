<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Candle Blow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prefixfree/1.0.7/prefixfree.min.js"></script>
  </head>
  <body>
    <h1 class="title">Happy Naksu Day!</h1>

    <div class="stage">
      <div class="cake-wrap">
        <div class="cake">
          <div class="plate"></div>
          <div class="layer layer-bottom"></div>
          <div class="layer layer-middle"></div>
          <div class="layer layer-top"></div>
          <div class="icing"></div>
          <div class="drip drip1"></div>
          <div class="drip drip2"></div>
          <div class="drip drip3"></div>
        </div>
      </div>
    </div>

    <div class="bottom-text">
      <p class="message">Wishing you a day full of joy, laughter, and cake!</p>
      <p class="note">Make a wish, then blow out the candles using the mic!</p>
    </div>
    <button id="restartBtn" class="music-btn restart-btn" type="button" aria-label="Restart" title="Restart">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-3-6.7"></path>
        <polyline points="21 3 21 9 15 9"></polyline>
      </svg>
    </button>
    <button id="musicBtn" class="music-btn" type="button">▶ Play</button>
    <script src="script.js"></script>
  </body>
</html>
